name: QA Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      TEST_TYPE:
        description: Test Type
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression

      BROWSER:
        description: Browser
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - edge
          - firefox

jobs:

  test:
    name: ${{ matrix.shard }}
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        shard:
          - group1
          - group2
          - group3
          - group4

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Tests
        shell: bash
        run: |
          TEST_TYPE="${{ inputs.TEST_TYPE || 'regression' }}"
          BROWSER="${{ inputs.BROWSER || 'chrome' }}"

          mvn clean test \
            -Dbrowser=$BROWSER \
            -Dcucumber.filter.tags=@$TEST_TYPE \
            -Dshard=${{ matrix.shard }} \
            -Dheadless=true

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.shard }}
          path: target/ExtentReport/
          if-no-files-found: warn

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.shard }}
          path: target/surefire-reports/
          if-no-files-found: warn